tc_name: "TC-05A"
description: "9초 통화 → LONG_CALL_DURATION 미발생 확인 (임계값 미달)"
metadata:
  source: TC_1.xlsx / SS-TC 1 / TC-05A
  priority: 필수
  repeat: 3
  tc_class: SEMI_AUTO
  runnable: true
  execution_type: EXTERNAL_EVENT
  manual_detail: CALL_RECEIVE
  has_manual_steps: true
steps:
  # 1. Setup
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "am force-stop com.example.seniorshield"
  - action: wait
    execution_mode: UI_AUTO
    step_role: SETUP
    duration: 1000
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "pm grant com.example.seniorshield android.permission.READ_PHONE_STATE"
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "logcat -c"
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    execution_mode: UI_AUTO
    step_role: SETUP
    duration: 3000
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ACTION
    name: "TC05A_01_before"

  # 2. 수동: 정확히 9초 통화
  - action: manual_pause
    execution_mode: EXTERNAL_EVENT
    step_role: ACTION
    description: "보조폰으로 전화를 걸어주세요. 수신 후 정확히 9초 통화한 뒤 종료하세요. (스톱워치 사용 권장)"
    manual_timeout: 120

  # 3. 대기
  - action: wait
    execution_mode: UI_AUTO
    step_role: ACTION
    duration: 5000

  # 4. 앱 복귀 — 경고 화면 없이 메인 화면이어야 함 (9초는 임계값 미달)
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: ACTION
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    execution_mode: UI_AUTO
    step_role: ACTION
    duration: 3000
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ACTION
    name: "TC05A_02_after"

  # 5. 크래시 없음 + 메인 화면 확인 (경고 화면 아님)
  - action: verify_text
    execution_mode: UI_AUTO
    step_role: ASSERT
    target: "시니어쉴드"

  # 6. Telecom 로그 확인
  - action: verify_shell
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    command: "logcat -d | grep showCallDuration || echo NOT_FOUND"
    expected: "showCallDuration"
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ASSERT
    name: "TC05A_03_verified"
