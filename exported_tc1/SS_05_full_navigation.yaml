name: "SS_05_전체화면순회_E2E"
description: "앱 실행 → 메인 확인 → 4개 서브화면 순회 → 각 화면 검증 → 홈"
steps:
  # 1. 앱 실행 및 메인 화면 확인
  - action: key
    keycode: HOME
  - action: wait
    seconds: 1
  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    seconds: 3
  - action: screenshot
    name: "SS05_01_main"
  - action: verify_text
    text: "시니어쉴드"
  - action: verify_text
    text: "위험 감지"

  # 2. 가족에게 바로 연락하기
  - action: tap_text
    text: "가족에게 바로 연락하기"
  - action: wait
    seconds: 2
  - action: screenshot
    name: "SS05_02_family"
  - action: verify_text
    text: "가족에게 전화하기"
  - action: key
    keycode: BACK
  - action: wait
    seconds: 1

  # 3. 전체 감지 기록 보기
  - action: tap_text
    text: "전체 감지 기록 보기"
  - action: wait
    seconds: 2
  - action: screenshot
    name: "SS05_03_history"
  - action: verify_text
    text: "전체 감지 기록"
  - action: key
    keycode: BACK
  - action: wait
    seconds: 1

  # 4. 보이스피싱 대응 연습
  - action: tap_text
    text: "보이스피싱 대응 연습"
  - action: wait
    seconds: 2
  - action: screenshot
    name: "SS05_04_training"
  - action: verify_text
    text: "검찰 사칭 사기"
  - action: verify_text
    text: "대출 사기"
  - action: verify_text
    text: "자녀 사칭 사기"
  - action: key
    keycode: BACK
  - action: wait
    seconds: 1

  # 5. 위험 감지 탭
  - action: tap_text
    text: "위험 감지"
  - action: wait
    seconds: 1
  - action: screenshot
    name: "SS05_05_danger_detect"
  - action: verify_text
    text: "반복 전화 경고"
  - action: key
    keycode: BACK
  - action: wait
    seconds: 1

  # 6. 종료
  - action: screenshot
    name: "SS05_06_final"
  - action: key
    keycode: HOME
