tc_name: SS_01_main_screen
description: |
  SS_01_앱실행_메인화면확인

  시니어쉴드 앱 실행 후 메인 화면 주요 UI 요소 존재 확인 (2026-04-16 리디자인 반영)
metadata:
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
steps:
  - action: key
    key: KEYCODE_HOME
  - action: wait
    duration: 1000
  - action: shell
    command: "am force-stop com.example.seniorshield"
  - action: wait
    duration: 1000
  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    duration: 3000
  - action: screenshot
    name: "SS01_01_main_screen"
  - action: verify_text
    target: "시니어쉴드"
  - action: verify_text
    target: "현재 보호 상태"
  - action: verify_text
    target: "안전합니다"
  - action: verify_text
    target: "보이스피싱 대응 연습"
  - action: verify_text
    target: "이번 주 예방 팁"
  - action: screenshot
    name: "SS01_02_verified"
