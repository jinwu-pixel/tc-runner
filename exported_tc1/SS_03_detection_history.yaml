tc_name: SS_03_detection_history
description: |
  SS_03_권한설정_진입확인

  메인 → 권한 설정 및 안내 진입 → 권한 항목 확인 → 뒤로 (2026-04-16 리디자인 반영)
metadata:
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
steps:
  - action: key
    key: KEYCODE_HOME
  - action: wait
    duration: 1000
  - action: shell
    command: "am force-stop com.example.seniorshield"
  - action: wait
    duration: 1000
  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    duration: 3000
  - action: swipe
    x: 240
    y: 600
    x2: 240
    y2: 200
    duration: 500
  - action: wait
    duration: 1000
  - action: tap_text
    target: "권한 설정 및 안내"
  - action: wait
    duration: 2000
  - action: screenshot
    name: "SS03_01_permissions"
  - action: verify_text
    target: "권한 설정"
  - action: screenshot
    name: "SS03_02_verified"
  - action: key
    key: KEYCODE_BACK
