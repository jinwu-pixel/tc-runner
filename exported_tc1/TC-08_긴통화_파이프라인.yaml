tc_name: "TC-08"
description: "권한 허용 상태에서 임계값 이상 통화 → 장시간 감지 이벤트 생성 및 감지 기록 반영 확인"
metadata:
  source: TC_1.xlsx / SS-TC 1 / TC-08
  priority: 필수
  repeat: 3
  tc_class: SEMI_AUTO
  runnable: true
  execution_type: EXTERNAL_EVENT
  manual_detail: CALL_RECEIVE
  has_manual_steps: true
steps:
  # 1. Setup
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "am force-stop com.example.seniorshield"
  - action: wait
    execution_mode: UI_AUTO
    step_role: SETUP
    duration: 1000
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "pm grant com.example.seniorshield android.permission.READ_PHONE_STATE"
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "logcat -c"
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: SETUP
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    execution_mode: UI_AUTO
    step_role: SETUP
    duration: 3000
  - action: verify_text
    execution_mode: UI_AUTO
    step_role: ASSERT
    target: "시니어쉴드"
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ACTION
    name: "TC08_01_main_before"

  # 2. 수동 통화 (임계값 이상)
  - action: manual_pause
    execution_mode: EXTERNAL_EVENT
    step_role: ACTION
    description: "보조폰으로 이 단말에 전화를 걸어주세요. 수신 후 10초 이상 통화한 뒤 종료하세요."
    manual_timeout: 120

  # 3. 처리 대기
  - action: wait
    execution_mode: UI_AUTO
    step_role: ACTION
    duration: 5000

  # 4. 앱 복귀 — 경고 화면 또는 메인 화면 확인
  - action: shell
    execution_mode: SHELL_AUTO
    step_role: ACTION
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    execution_mode: UI_AUTO
    step_role: ACTION
    duration: 3000
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ACTION
    name: "TC08_02_after_call"

  # 5. 장시간 통화 감지 확인 (경고 화면에서 직접 확인)
  - action: verify_text
    execution_mode: UI_AUTO
    step_role: ASSERT
    target: "장시간 의심 통화 감지"
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ACTION
    name: "TC08_03_warning_screen"

  # 6. 경고 화면에서 메인으로 돌아가기
  - action: key
    execution_mode: UI_AUTO
    step_role: ACTION
    key: BACK
  - action: wait
    execution_mode: UI_AUTO
    step_role: ACTION
    duration: 2000

  # 7. 감지 기록 확인
  - action: tap_text
    execution_mode: UI_AUTO
    step_role: ACTION
    target: "전체 감지 기록 보기"
  - action: wait
    execution_mode: UI_AUTO
    step_role: ACTION
    duration: 2000
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ACTION
    name: "TC08_04_history"
  - action: key
    execution_mode: UI_AUTO
    step_role: ACTION
    key: BACK

  # 8. Telecom 로그로 통화 시간 확인
  - action: verify_shell
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    command: "logcat -d | grep showCallDuration || echo NOT_FOUND"
    expected: "showCallDuration"
  - action: screenshot
    execution_mode: UI_AUTO
    step_role: ASSERT
    name: "TC08_05_verified"
