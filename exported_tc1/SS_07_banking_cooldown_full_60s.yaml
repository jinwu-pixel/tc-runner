tc_name: "SS_07_banking_cooldown_full_60s"
description: |
  [SeniorShield 뱅킹 쿨다운 풀 카운트다운] CRITICAL 팝업 표시 직후 60초 쿨다운이
  물리 키 입력 없이 조기 해제되지 않고 풀(58~62초) 카운트다운되는지 검증.
  dismissedAt - showedAt epoch-ms 차이로 실측. Run1=60595ms / Run2=60468ms (2026-04-13).
  D-pad/OK 키 입력 시 조기 해제는 known limitation으로 분리 기록.

metadata:
  source: "2026-04-13 스타일폴더 2 실기 검증 Run1/Run2 쿨다운 showedAt/dismissedAt 측정"
  runnable: true
  tc_class: SEMI_AUTO
  execution_type: EXTERNAL_EVENT
  manual_detail: "CALL_RECEIVE|CALL_PLACE"
  has_manual_steps: true
  has_shell_actions: true
  has_unresolved_params: false
  warnings:
    - "카운트다운 60초 동안 D-pad/OK 등 어떤 물리 키도 누르지 말 것 — 포커스된 버튼 tap 처리되어 조기 해제됨"
    - "조기 해제 케이스 보고: 2026-04-13 13:57 12초에 해제 관찰 (키 입력 추정) — 키 입력 배제 재현 테스트에서는 60.5초 풀 카운트다운 확인"
    - "외부 의존은 SS_06과 동일 (보조폰 수신 유발 + 주 단말 ARS 발신)"
    - "쿨다운 epoch-ms는 System.currentTimeMillis 기반 — PII 아님"

preconditions:
  - "단말: 스타일폴더 2 (AT-M140), Android 14, LG U+ SIM"
  - "SS_06 preconditions 동일 (SYSTEM_ALERT_WINDOW appop, READ_PHONE_STATE, READ_CALL_LOG, READ_CONTACTS, 테스트 모드 ON)"
  - "보조폰 1대 + 15993333 발신 가능"

steps:
  # ============================================================
  # SETUP — SS_06 축약 (권한/로그 초기화)
  # ============================================================
  - action: shell
    command: "am force-stop com.example.seniorshield"
    description: "앱 강제 종료"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "force-stop", source_phase: procedure, position: 1, total_segments: 16 }

  - action: verify_shell
    command: "cmd appops get com.example.seniorshield SYSTEM_ALERT_WINDOW"
    expected: "allow"
    description: "오버레이 appop 허용 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK
    source_trace: { raw_segment: "appops 확인", source_phase: procedure, position: 2, total_segments: 16 }

  - action: shell
    command: "pm grant com.example.seniorshield android.permission.READ_PHONE_STATE"
    description: "READ_PHONE_STATE 권한"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "권한 부여", source_phase: procedure, position: 3, total_segments: 16 }

  - action: shell
    command: "pm grant com.example.seniorshield android.permission.READ_CALL_LOG"
    description: "READ_CALL_LOG 권한"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "권한 부여", source_phase: procedure, position: 4, total_segments: 16 }

  - action: shell
    command: "pm grant com.example.seniorshield android.permission.READ_CONTACTS"
    description: "READ_CONTACTS 권한"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "권한 부여", source_phase: procedure, position: 5, total_segments: 16 }

  - action: shell
    command: "logcat -G 16M"
    description: "logcat 버퍼 확장"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "로그 버퍼", source_phase: procedure, position: 6, total_segments: 16 }

  - action: shell
    command: "logcat -c"
    description: "로그 클리어"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "로그 클리어", source_phase: procedure, position: 7, total_segments: 16 }

  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
    description: "시니어쉴드 실행"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "앱 실행", source_phase: procedure, position: 8, total_segments: 16 }

  - action: wait
    duration: 5000
    description: "서비스/코디네이터/CallMonitor 초기화 대기"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK
    source_trace: { raw_segment: "초기화 대기", source_phase: procedure, position: 9, total_segments: 16 }

  # ============================================================
  # EXTERNAL EVENT — 쿨다운 발동까지 (SS_06 축약)
  # ============================================================
  - action: manual_pause
    description: |
      [Phase 1 + Phase 2 축약 — 쿨다운 발동까지]
      1. 보조폰(미저장 번호)에서 주 단말(스타일폴더 2)로 발신 → 수신 → 약 15초 통화 → 종료
      2. 1~2분 이내에 주 단말에서 15993333 발신 → 통화 연결
      3. 전체화면 CRITICAL 팝업 + "쿨다운 60초" 카운트다운 표시 확인
      4. **여기서부터 카운트다운이 끝날 때까지 어떤 키도 누르지 마세요** (D-pad/OK 누르면 즉시 해제)
      팝업/카운트다운 표시 확인 후 [Continue]
    manual_timeout: 360
    on_timeout: fail
    execution_mode: EXTERNAL_EVENT
    step_role: ACTION
    compile_status: OK
    source_trace: { raw_segment: "SS_06 축약 - 쿨다운 발동까지", source_phase: procedure, position: 10, total_segments: 16 }

  - action: verify_shell
    command: "logcat -d -s SeniorShield-Cooldown:D | grep -c '쿨다운 시작: 60초' || echo 0"
    expected: "1"
    description: "쿨다운 시작 로그 기록됨 — showedAt epoch-ms 포함"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK
    source_trace: { raw_segment: "쿨다운 시작 기록", source_phase: expected, position: 11, total_segments: 16 }

  # ============================================================
  # 60초 풀 대기 — 키 입력 금지 구간
  # ============================================================
  - action: wait
    duration: 65000
    description: "쿨다운 60초 풀 완료 + 5초 여유 버퍼. 이 구간 동안 기기 물리 키 입력 절대 금지."
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK
    source_trace: { raw_segment: "60초 풀 대기 - 키 입력 금지", source_phase: procedure, position: 12, total_segments: 16 }

  # ============================================================
  # ASSERT — 쿨다운 풀 카운트다운 검증 (dismissedAt - showedAt)
  # ============================================================
  - action: verify_shell
    command: "logcat -d -s SeniorShield-Cooldown:D | grep -c '쿨다운 종료' || echo 0"
    expected: "1"
    description: "쿨다운 종료 로그 기록됨 — dismissedAt epoch-ms 포함"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK
    source_trace: { raw_segment: "쿨다운 종료 기록", source_phase: expected, position: 13, total_segments: 16 }

  - action: verify_shell
    command: "logcat -d -s SeniorShield-Cooldown:D | grep -oE '(showedAt|dismissedAt)=[0-9]+' | cut -d= -f2 | (read s; read d; diff=$((d-s)); [ $diff -ge 58000 ] && [ $diff -le 62000 ] && echo OK || echo BAD:$diff)"
    expected: "OK"
    description: |
      쿨다운 실제 지속시간 측정: dismissedAt - showedAt (epoch-ms 차이).
      판정: 58000 ≤ diff ≤ 62000 ms → OK (58초~62초 허용범위).
      Run1 실측 60595ms / Run2 실측 60468ms (2026-04-13 PASS).
      diff < 58000 → 조기 해제 (키 입력 추정 또는 로직 버그), diff > 62000 → 지연 해제.
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK
    source_trace: { raw_segment: "쿨다운 duration 측정", source_phase: expected, position: 14, total_segments: 16 }

  - action: verify_shell
    command: "logcat -d | grep -c FATAL || echo 0"
    expected: "0"
    description: "FATAL 없음"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK
    source_trace: { raw_segment: "크래시 없음", source_phase: expected, position: 15, total_segments: 16 }

  # ============================================================
  # TEARDOWN
  # ============================================================
  - action: shell
    command: "am force-stop com.example.seniorshield"
    description: "상태 복구 — 모든 서비스/오버레이/잔여 쿨다운 정리"
    execution_mode: SHELL_AUTO
    step_role: TEARDOWN
    compile_status: OK
    source_trace: { raw_segment: "force-stop 복구", source_phase: procedure, position: 16, total_segments: 16 }
