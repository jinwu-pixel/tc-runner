name: "SS_02_앱설정_진입확인"
description: "메인 → 앱 설정 진입 → 설정 항목 확인 → 뒤로 (2026-04-16 리디자인 반영)"
steps:
  - action: key
    keycode: HOME
  - action: wait
    seconds: 1
  - action: shell
    command: "am force-stop com.example.seniorshield"
  - action: wait
    seconds: 1
  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    seconds: 3
  - action: swipe
    x1: 240
    y1: 600
    x2: 240
    y2: 200
    duration: 500
  - action: wait
    seconds: 1
  - action: swipe
    x1: 240
    y1: 700
    x2: 240
    y2: 100
    duration: 500
  - action: wait
    seconds: 1
  - action: tap_text
    text: "앱 설정"
  - action: wait
    seconds: 2
  - action: screenshot
    name: "SS02_01_settings"
  - action: verify_text
    text: "앱 설정"
  - action: verify_text
    text: "보호자 연락처 관리"
  - action: screenshot
    name: "SS02_02_verified"
  - action: key
    keycode: BACK
