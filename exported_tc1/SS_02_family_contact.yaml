name: "SS_02_가족연락하기_진입확인"
description: "메인 → 가족에게 바로 연락하기 → 안내 내용 및 버튼 확인 → 뒤로"
steps:
  - action: key
    keycode: HOME
  - action: wait
    seconds: 1
  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    seconds: 3
  - action: tap_text
    text: "가족에게 바로 연락하기"
  - action: wait
    seconds: 2
  - action: screenshot
    name: "SS02_01_family_contact"
  - action: verify_text
    text: "지금 해야 할 일"
  - action: verify_text
    text: "전화를 끊으세요"
  - action: verify_text
    text: "앱을 더 설치하지 마세요"
  - action: verify_text
    text: "가족이나 공식 기관에 먼저 확인하세요"
  - action: verify_text
    text: "가족에게 전화하기"
  - action: screenshot
    name: "SS02_02_verified"
  - action: key
    keycode: BACK
