tc_name: "SS_TC_ALPHA_4_upgrade_escape"
description: "α escape 검증: 텔레뱅킹 arm(call 신호 5종) → 단독 REMOTE 재주입 → subset 위반으로 α 우회 → 새 세션 + 팝업"
metadata:
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
steps:
  # 1. 앱 cold restart
  - action: key
    key: KEYCODE_HOME
  - action: wait
    duration: 1000
  - action: shell
    command: "am force-stop com.example.seniorshield"
  - action: wait
    duration: 2000
  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    duration: 5000

  # 2. Home → 앱 설정 진입
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 2000
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 3000
  - action: tap_text
    target: "앱 설정"
  - action: wait
    duration: 4000

  # 3. 디버그 패널까지 스크롤
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 2000
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 2000
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 3000

  # 4. SESSION_1: 텔레뱅킹 sim으로 CRITICAL 세션 생성 (arm = 5 call 신호)
  - action: shell
    command: "log -t SeniorShield-Test 'ALPHA4 SESSION_1_telebanking_sim'"
  - action: tap_text
    target: "텔레뱅킹 유도 사기 시뮬레이션"
  - action: wait
    duration: 4000

  # 5. CRITICAL 팝업
  - action: screenshot
    name: "ALPHA4_01_telebanking_popup"
  - action: verify_text
    target: "매우 위험"

  # 6. 앱 열어서 확인
  - action: tap_text
    target: "앱 열어서 확인하기"
  - action: wait
    duration: 4000
  - action: verify_text
    target: "위험 감지"

  # 7. α arm: confirm-safe
  - action: shell
    command: "log -t SeniorShield-Test 'ALPHA4 ALPHA_ARM call_signals'"
  - action: tap_text
    target: "안전 확인했어요"
  - action: wait
    duration: 4000
  - action: verify_text
    target: "현재 보호 상태"

  # 8. Home 스크롤 후 앱 설정 재진입
  - action: shell
    command: "log -t SeniorShield-Test 'ALPHA4 RETURN_TO_SETTINGS'"
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 2000
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 2000
  - action: tap_text
    target: "앱 설정"
  - action: wait
    duration: 4000
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 2000
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 2000
  - action: swipe
    x: 240
    y: 700
    x2: 240
    y2: 200
    duration: 800
  - action: wait
    duration: 3000

  # 9. ATTEMPT_ESCAPE: 단독 REMOTE 재주입 (REMOTE ∉ armed call 신호군 → subset 위반 → α 우회)
  - action: shell
    command: "log -t SeniorShield-Test 'ALPHA4 ATTEMPT_ESCAPE subset_violation'"
  - action: tap_text
    target: "원격제어 앱 실행 시뮬레이션"
  - action: wait
    duration: 4000

  # 10. 팝업 발화 검증 (α did NOT suppress)
  - action: screenshot
    name: "ALPHA4_02_escape_popup"
  - action: verify_text
    target: "원격제어 앱 실행 감지"

  # 11. 정리
  - action: shell
    command: "log -t SeniorShield-Test 'ALPHA4 GATE_END PASS-level UI verified'"
  - action: key
    key: KEYCODE_HOME
