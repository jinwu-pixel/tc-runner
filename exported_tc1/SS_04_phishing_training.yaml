tc_name: SS_04_phishing_training
description: |
  SS_04_보이스피싱대응연습_진입확인

  메인 → 보이스피싱 대응 연습 → 시나리오 목록 확인 → 뒤로
metadata:
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
steps:
  - action: key
    key: KEYCODE_HOME
  - action: wait
    duration: 1000
  - action: shell
    command: "am force-stop com.example.seniorshield"
  - action: wait
    duration: 1000
  - action: shell
    command: "am start -n com.example.seniorshield/.MainActivity"
  - action: wait
    duration: 3000
  - action: tap_text
    target: "보이스피싱 대응 연습"
  - action: wait
    duration: 2000
  - action: screenshot
    name: "SS04_01_training_screen"
  - action: verify_text
    target: "보이스피싱 대응 연습"
  - action: verify_text
    target: "검찰 사칭 사기"
  - action: verify_text
    target: "3단계"
  - action: verify_text
    target: "대출 사기"
  - action: verify_text
    target: "2단계"
  - action: verify_text
    target: "자녀 사칭 사기"
  - action: screenshot
    name: "SS04_02_verified"
  - action: key
    key: KEYCODE_BACK
