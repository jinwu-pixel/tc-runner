tc_name: "MNF_FUNC_24_cat_apps"
description: |
  [MiniFile · 설치된 앱 카테고리]
  홈 "앱" 탭 (실제 라벨 "앱", 스펙은 "설치된 앱") → 앱 목록 확인.
  PACKAGE_USAGE_STATS granted 상태에서 설치된 앱 목록 표시 확인.

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "권한 전부 granted (PACKAGE_USAGE_STATS 포함)"

steps:
  - action: shell
    command: "monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 800
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 587
    y: 901
    description: "앱 카테고리 탭 (실제 라벨 '앱')"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 2500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "MNF_24_apps_category"
    description: "앱 카테고리 진입 화면 캡처"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "dumpsys window | grep mCurrentFocus"
    expected: "mnnr_files"
    description: "앱 내에서 표시 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
