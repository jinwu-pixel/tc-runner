tc_name: "MNF_FUNC_21_cat_audio"
description: |
  [MiniFile · 오디오 카테고리 + WAV 노출 확인]
  홈 오디오 탭 → MediaStore 오디오 리스트 진입 → 타이틀 "오디오" 확인 + WAV 파일 노출 확인.
  오디오 포맷 판정 규칙: WAV 2건(minifile_silent.wav, minifile_tone_440.wav) 노출되면 규칙 불필요 기록.
  미노출 시 logcat MIME 필터 관찰 → 3단계 규칙 발동.

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "권한 전부 granted"
  - "Music/minifile_silent.wav, Music/minifile_tone_440.wav 존재"

steps:
  - action: shell
    command: "am force-stop com.example.mnnr_files && monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 587
    y: 1323
    description: "오디오 카테고리 탭 (홈 1st viewport 우측)"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "MNF_21_audio_category"
    description: "오디오 카테고리 진입 캡처"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "오디오"
    description: "타이틀 확인 (MediaStore 오디오 리스트)"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -c 'minifile_silent.wav' /sdcard/ui.xml || echo 0"
    expected: "1"
    description: "WAV 파일 오디오 카테고리 노출 확인 (오디오 규칙 판정)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
