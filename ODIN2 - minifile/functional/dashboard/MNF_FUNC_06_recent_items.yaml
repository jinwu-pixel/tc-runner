tc_name: "MNF_FUNC_06_recent_items"
description: |
  [MiniFile · 최근 항목 가로 스크롤]
  홈 최근 항목 RecyclerView 에 preset 파일이 노출되는지 확인.
  가로 스크롤 시 추가 항목 확인. 카드 탭 → 해당 파일 뷰어 진입 확인.

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial c4324122 연결"
  - "권한 전부 granted"
  - "preset: minifile_silent.wav, minifile_tone_440.wav in Music 확인"

steps:
  - action: shell
    command: "monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2500
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: verify_text
    target: "최근 항목"
    description: "최근 항목 섹션 라벨 확인"
    timeout: 4000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "minifile_silent.wav"
    description: "최근 항목에 WAV 파일 노출 확인"
    timeout: 4000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 가로 스크롤
  - action: swipe
    x: 600
    y: 897
    x2: 200
    y2: 897
    duration: 400
    description: "최근 항목 가로 스크롤"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 800
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "MNF_06_recent_scroll"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 최근 항목 카드 탭
  - action: tap_xy
    x: 154
    y: 897
    description: "최근 항목 첫 카드 탭 → 뷰어 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "dumpsys window | grep mCurrentFocus"
    expected: "mnnr_files"
    description: "파일 뷰어 또는 관련 Activity 진입 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
