tc_name: "MNF_FUNC_13_ops_move_copy"
description: |
  [MiniFile · 파일 복사 (Download → Documents)]
  Download/minifile_readme.txt 를 Documents/ 로 복사.
  btn_more → "다음으로 복사" → FAB "여기에 붙여넣기" 노출 확인 → 목적지 폴더 진입 → FAB 탭 → 복사 완료.
  복사 후 원본(Download) 유지 + 대상(Documents) 존재 확인.
  방향 선택 이유: 복사 FAB([75,1304][644,1416]) 가 root browser 의 Download 행([1324,1368]) 과 겹쳐서
  Download 를 목적지로 하면 탭이 FAB paste 로 해석됨. Documents(y=1222) 는 FAB 상단이라 안전.

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial c4324122 연결"
  - "권한 전부 granted"
  - "Download/minifile_readme.txt 존재 (preset)"

steps:
  # 사전 정리: 테스트 중복 방지 (이전 run 에서 남아있을 수 있는 복사본 제거)
  - action: shell
    command: "rm -f /sdcard/Documents/minifile_readme.txt"
    description: "테스트 시작 전 대상 경로 정리"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mnnr_files && monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # 홈 → 내부 저장소
  - action: swipe
    x: 360
    y: 1200
    x2: 360
    y2: 400
    duration: 400
    description: "홈 스크롤 다운 1회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 1200
    x2: 360
    y2: 400
    duration: 400
    description: "홈 스크롤 다운 2회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1000
    description: "layout_internal_storage 탭 → 루트 파일브라우저"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # 루트에서 Download 진입 (텍스트 기반 — 추가 폴더 유무에 무관)
  - action: tap_text
    target: "Download"
    description: "Download 폴더 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "minifile_readme.txt"
    description: "원본 파일 진입 확인"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 첫 행(minifile_readme.txt) btn_more
  - action: tap_xy
    x: 608
    y: 502
    description: "row 0 btn_more (minifile_readme.txt)"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "다음으로 복사"
    description: "컨텍스트 메뉴 확인"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_text
    target: "다음으로 복사"
    description: "복사 메뉴 탭 → 클립보드 모드"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # FAB 노출 확인
  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -c 'fab_paste' /sdcard/ui.xml"
    expected: "1"
    description: "fab_paste FAB 노출 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: screenshot
    name: "MNF_13_fab_visible"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 루트로 돌아가기 (FAB 유지됨)
  - action: key
    key: "KEYCODE_BACK"
    description: "Download → 루트"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # Documents 진입 — FAB(y=1304~1416) 상단 y=1222 이므로 텍스트 탭 안전
  - action: tap_text
    target: "Documents"
    description: "Documents 폴더 진입 (FAB 유지)"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -c 'fab_paste' /sdcard/ui.xml"
    expected: "1"
    description: "Documents 에서도 FAB 유지 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  # FAB 탭 → 복사 실행
  - action: tap_text
    target: "여기에 붙여넣기"
    description: "FAB 탭 → Documents 에 paste"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # 결과 검증
  - action: verify_shell
    command: "ls /sdcard/Documents/minifile_readme.txt 2>/dev/null && echo COPIED || echo MISSING"
    expected: "COPIED"
    description: "Documents 에 복사본 존재"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "ls /sdcard/Download/minifile_readme.txt 2>/dev/null && echo KEPT || echo MISSING"
    expected: "KEPT"
    description: "원본(Download) 유지 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  # TEARDOWN: 복사본 제거
  - action: shell
    command: "rm -f /sdcard/Documents/minifile_readme.txt"
    execution_mode: SHELL_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
