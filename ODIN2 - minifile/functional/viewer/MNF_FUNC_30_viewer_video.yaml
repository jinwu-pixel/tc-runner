tc_name: "MNF_FUNC_30_viewer_video"
description: |
  [MiniFile · 동영상 뷰어 컨트롤러 (신규)]
  DCIM/MyGallery_TC/VID_20s.mp4 탭 → 인앱 ViewerActivity (videoView) 진입 확인.
  주의: 파일 출처(Movies/screen-*.mp4 등)에 따라 ChooserActivity 로 라우팅되는 케이스 존재 — BUG_REPORT NOTE-03 참조.

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "권한 전부 granted"
  - "DCIM/MyGallery_TC/VID_20s.mp4 존재 (Gallery preset)"

steps:
  - action: shell
    command: "am force-stop com.example.mnnr_files && monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 1회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 2회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1000
    description: "내부 저장소 (layout_internal_storage) 탭 → 루트 파일브라우저"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # DCIM 폴더 (루트 4번째 y=934)
  - action: tap_xy
    x: 360
    y: 934
    description: "DCIM 폴더 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # MyGallery_TC 서브폴더 (DCIM/Camera 다음 항목)
  - action: tap_text
    target: "MyGallery_TC"
    description: "MyGallery_TC 폴더 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # MyGallery_TC 27개 파일 (25 IMG + 2 VID), VID 는 정렬 하단 → 스크롤 필요
  - action: swipe
    x: 360
    y: 1300
    x2: 360
    y2: 400
    duration: 400
    description: "VID_20s.mp4 노출 위해 1차 스크롤"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 1300
    x2: 360
    y2: 400
    duration: 400
    description: "2차 스크롤"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 1300
    x2: 360
    y2: 400
    duration: 400
    description: "3차 스크롤"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_text
    target: "VID_20s.mp4"
    description: "VID_20s.mp4 탭 — 인앱 뷰어 동작 확인된 파일"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "dumpsys window | grep mCurrentFocus"
    expected: "ViewerActivity"
    description: "ViewerActivity 진입 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: screenshot
    name: "MNF_30_video_viewer"
    description: "동영상 뷰어 캡처 (컨트롤러 확인)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
