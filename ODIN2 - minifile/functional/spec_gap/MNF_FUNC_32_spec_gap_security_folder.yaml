tc_name: "MNF_FUNC_32_spec_gap_security_folder"
description: |
  [MiniFile · 보안폴더 진입점 부재 확인 (SPEC_GAP)]
  홈 화면 및 selection 더보기 메뉴에 보안폴더 진입점이 없음을 검증.
  배포 노트: "보안폴더 삭제" — 진입점 없어야 함.
  USE_BIOMETRIC/FINGERPRINT 권한은 여전히 Manifest에 선언됨 (별도 확인).

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "권한 전부 granted"

steps:
  - action: shell
    command: "am force-stop com.example.mnnr_files && monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # 홈 전체 UI 덤프 → 보안 관련 텍스트 없음 확인
  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -c '보안' /sdcard/ui.xml || echo 0"
    expected: "0"
    description: "홈: 보안폴더 진입점 부재 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  # selection 더보기 메뉴에서도 보안 없음 확인 (내부 저장소 경로로 진입)
  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 1회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 2회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1000
    description: "내부 저장소 (layout_internal_storage) 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 934
    description: "DCIM 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 626
    description: "MyGallery_TC 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 608
    y: 502
    description: "첫 파일 btn_more 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -c '보안' /sdcard/ui.xml || echo 0"
    expected: "0"
    description: "파일 컨텍스트 메뉴: 보안폴더로 이동 항목 부재 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: screenshot
    name: "MNF_32_no_security_folder_menu"
    description: "보안폴더 메뉴 없는 컨텍스트 메뉴 캡처"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # Biometric 권한 선언 확인 (logcat 호출 없음 확인)
  - action: verify_shell
    command: "dumpsys package com.example.mnnr_files | grep -c 'USE_BIOMETRIC' || echo 0"
    expected: "2"
    description: "SPEC_GAP: USE_BIOMETRIC 권한 Manifest 선언 잔존 (Manifest 선언 + feature 태그 중복 카운트 = 2)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
