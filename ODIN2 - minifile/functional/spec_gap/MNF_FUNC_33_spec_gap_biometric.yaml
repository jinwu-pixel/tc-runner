tc_name: "MNF_FUNC_33_spec_gap_biometric"
description: |
  [MiniFile · 생체권한 미사용 잔존 확인 (SPEC_GAP)]
  앱 정상 사용 중 logcat에 Biometric API 호출이 없는지 확인.
  USE_BIOMETRIC / USE_FINGERPRINT 권한이 Manifest에 선언됐지만 실제 호출 없음 확인.

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "권한 전부 granted"

steps:
  - action: shell
    command: "logcat -c"
    description: "logcat 버퍼 초기화"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mnnr_files && monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # 홈 탐색 + 파일브라우저 + 파일 열기 (내부 저장소 경로)
  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 1회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 2회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1000
    description: "내부 저장소 (layout_internal_storage) 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 934
    description: "DCIM 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 626
    description: "MyGallery_TC 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 502
    description: "파일 열기"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # logcat Biometric API 호출 없음 확인
  - action: verify_shell
    command: "logcat -d | grep -c -iE 'BiometricPrompt|FingerprintManager|authenticate|biometric' || echo 0"
    expected: "0"
    description: "Biometric API 호출 없음 확인 (SPEC_GAP: 권한 선언됐지만 미사용)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  # Manifest 권한 선언 확인 (잔존 확인)
  # distinct 권한 수로 카운트 — grep 결과에는 선언줄+granted줄이 섞이므로
  # USE_BIOMETRIC/USE_FINGERPRINT 두 권한의 존재만 증명
  - action: verify_shell
    command: "dumpsys package com.example.mnnr_files | grep -oE 'USE_(BIOMETRIC|FINGERPRINT)' | sort -u | wc -l"
    expected: "2"
    description: "SPEC_GAP 증거: USE_BIOMETRIC / USE_FINGERPRINT 두 권한 Manifest 잔존"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
