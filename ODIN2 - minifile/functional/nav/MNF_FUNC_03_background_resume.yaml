tc_name: "MNF_FUNC_03_background_resume"
description: |
  [MiniFile · 백그라운드 복귀 상태 보존]
  폴더 진입 상태에서 HOME → 앱 재진입 시 이전 경로 보존 여부 확인.
  선택 모드 및 검색 쿼리 보존 여부도 확인.

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial c4324122 연결"
  - "권한 전부 granted"

steps:
  - action: shell
    command: "am force-stop com.example.mnnr_files && monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # 내부 저장소 폴더 브라우저 진입 (홈 2회 스크롤 → layout_internal_storage → DCIM)
  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 1회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 900
    x2: 360
    y2: 300
    duration: 400
    description: "홈 스크롤 다운 2회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1000
    description: "내부 저장소 (layout_internal_storage) 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 934
    description: "DCIM 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "DCIM"
    description: "DCIM 진입 확인"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # HOME 키 → 백그라운드
  - action: key
    key: "KEYCODE_HOME"
    description: "HOME → 백그라운드"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # 앱 재진입 (최근 앱 or 재실행)
  - action: shell
    command: "monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    description: "앱 재진입 (백그라운드에서 복귀)"
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "MNF_03_bg_resume"
    description: "백그라운드 복귀 화면 캡처"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "DCIM"
    description: "복귀 후 이전 경로(DCIM) 유지 확인"
    timeout: 4000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
