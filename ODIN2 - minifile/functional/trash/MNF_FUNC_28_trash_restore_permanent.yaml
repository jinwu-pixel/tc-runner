tc_name: "MNF_FUNC_28_trash_restore_permanent"
description: |
  [MiniFile · 휴지통 복원 완전 플로우]
  Download/minifile_sample.zip 선택 → 삭제(휴지통 이동) → 휴지통 진입 → 복원 메뉴 확인 →
  복원 탭 → 원경로 파일 복귀 확인.
  (완전삭제 경고 다이얼로그 확인은 TC_14 에서 수행 — 여기서는 복원 경로 검증)

metadata:
  source_file: "doc/minifile.pdf"
  source_sheet: null
  source_row: null
  tc_class: FULL_AUTO
  runnable: true
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mnnr_files"
    version: "1.0.26042210"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "권한 전부 granted"
  - "Download/minifile_sample.zip 존재 (preset row 1)"

steps:
  - action: shell
    command: "am force-stop com.example.mnnr_files && monkey -p com.example.mnnr_files -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: swipe
    x: 360
    y: 1200
    x2: 360
    y2: 400
    duration: 400
    description: "홈 스크롤 다운 1회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 1200
    x2: 360
    y2: 400
    duration: 400
    description: "홈 스크롤 다운 2회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1000
    description: "layout_internal_storage 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_text
    target: "Download"
    description: "Download 폴더 진입"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  # row 1(minifile_sample.zip) long-press
  - action: swipe
    x: 360
    y: 646
    x2: 360
    y2: 646
    duration: 800
    description: "row 1 long-press (minifile_sample.zip)"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "1개 선택됨"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 560
    y: 144
    description: "선택 toolbar 삭제 버튼"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 582
    y: 873
    description: "삭제 확인"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "ls /sdcard/Download/minifile_sample.zip 2>/dev/null && echo STILL || echo MOVED"
    expected: "MOVED"
    description: "원본 경로에서 제거 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  # 홈 → 휴지통
  - action: key
    key: "KEYCODE_BACK"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 1200
    x2: 360
    y2: 400
    duration: 400
    description: "홈 스크롤 다운 1회"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 600
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 360
    y: 1200
    x2: 360
    y2: 400
    duration: 400
    description: "홈 스크롤 다운 2회 (card_trash)"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 800
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1184
    description: "card_trash 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "휴지통"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "minifile_sample.zip"
    description: "삭제 파일 휴지통 존재"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 복원
  - action: tap_xy
    x: 608
    y: 502
    description: "휴지통 row 0 btn_more"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1200
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "복원"
    timeout: 2000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "완전 삭제"
    timeout: 2000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_text
    target: "복원"
    description: "복원 탭"
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 2000
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "ls /sdcard/Download/minifile_sample.zip 2>/dev/null && echo RESTORED || echo MISSING"
    expected: "RESTORED"
    description: "복원 후 원경로 복귀"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
