# ============================================================
# runner_capability.yaml — tc-runner 실행 환경 프로필
# ============================================================
# 러너 버전이 바뀌거나 기능이 추가되면 이 파일을 갱신합니다.
# ============================================================

runner_version: "1.4.0"   # 1.4.0 — verify_focus_moved list 모델(focus_model: list) 지원 추가 (B-5)

supported_actions:
  - tap_text
  - tap_id
  - tap_xy
  - tap_content_desc
  - key
  - shell
  - input_text
  - swipe
  - wait
  - screenshot
  - manual_pause
  - verify_text
  - verify_shell
  - verify_gone
  - verify_content_desc
  - verify_focus_moved            # focus_model: node(focused 노드 bounds 이동) | list(AdapterView 계열 — 컨테이너 focused 고정 + selected 자식 이동) 양 모델 지원 (B-5). 미지정 시 node.

supports_content_desc: true

multi_device: false
max_manual_timeout: 600

shell_action_map_version: "1.0"
shell_actions_available:
  - launch_app
  - force_stop
  - grant_permission
  - revoke_permission
  - clear_logcat
  - open_settings

