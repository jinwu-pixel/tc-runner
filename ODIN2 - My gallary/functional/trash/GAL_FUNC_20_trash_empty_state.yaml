tc_name: "GAL_FUNC_20_trash_empty_state"
description: |
  [마이 갤러리 · 휴지통 빈 상태]
  휴지통 탭 (비어있음 상태) 진입 → 타이틀/빈 메시지/⋮ 메뉴 2종 확인.
  ⋮ 메뉴: '보관 기간 설정' / '휴지통 비우기'.
  (참고: GAL-BUG-004 CONFIRMED — 복원 기능 부재)

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "휴지통 비어있음 상태 (최근 삭제 이력 없음)"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 600
    y: 1408
    description: "하단 '휴지통' 탭 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_20_01_trash_empty"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "휴지통"
    description: "타이틀 '휴지통'"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "미디어가 없습니다"
    description: "빈 상태 메시지"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnMenu /sdcard/ui.xml && echo OK || echo FAIL"
    expected: "OK"
    description: "⋮ 메뉴 버튼 노출"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 672
    y: 144
    description: "⋮ 메뉴 오픈"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "보관 기간 설정"
    description: "메뉴 항목 1: 보관 기간 설정"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "휴지통 비우기"
    description: "메뉴 항목 2: 휴지통 비우기"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "메뉴 닫기"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
