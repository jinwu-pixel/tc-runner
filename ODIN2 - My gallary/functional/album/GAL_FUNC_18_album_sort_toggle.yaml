tc_name: "GAL_FUNC_18_album_sort_toggle"
description: |
  [마이 갤러리 · 앨범 정렬 5종 전환]
  앨범 탭 정렬 드롭다운(tvSortLabel)에 노출되는 5개 옵션:
    최신순 / 이름순 (ㄱ-ㅎ) / 이름순 (ㅎ-ㄱ) / 수정 날짜순 / 크기순
  각 옵션 선택 후 드롭다운 닫히고 라벨 변경되는지 검증.
  주의: 메뉴트리 순서와 실기 순서 상이 (실기: 최신 / 이름ㄱㅎ / 이름ㅎㄱ / 수정일 / 크기).

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1408
    description: "앨범 탭 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 614
    y: 220
    description: "정렬 라벨 '최신순' 탭 → 드롭다운"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "이름순 (ㄱ-ㅎ)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "이름순 (ㅎ-ㄱ)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "수정 날짜순"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "크기순"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 409
    description: "'이름순 (ㄱ-ㅎ)' 선택"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_18_01_name_asc"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "이름순 (ㄱ-ㅎ)"
    description: "정렬 라벨이 '이름순 (ㄱ-ㅎ)' 으로 변경"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 614
    y: 220
    description: "드롭다운 재오픈"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 505
    description: "'이름순 (ㅎ-ㄱ)' 선택"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_18_02_name_desc"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "이름순 (ㅎ-ㄱ)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 614
    y: 220
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 601
    description: "'수정 날짜순' 선택"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_18_03_mtime"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "수정 날짜순"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 614
    y: 220
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 697
    description: "'크기순' 선택"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_18_04_size"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "크기순"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 최신순 복귀
  - action: tap_xy
    x: 614
    y: 220
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 313
    description: "'최신순' 복귀"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "최신순"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
