tc_name: "GAL_FUNC_08_photo_detail_info_model_spec_gap"
description: |
  [마이 갤러리 · 상세 정보에 기기 모델 EXIF 미노출 회귀 앵커]
  스펙: "촬영 데이터 추출: ... 기기 모델명(Exif 정보)을 분석하여 사용자에게 보여줍니다"
  실기: Make=ALTech, Model=AT-M150 주입된 preset 사진 상세정보에 Make/Model 미노출 (GAL-BUG-001 SPEC_GAP).

  이 TC는 'PASS = 버그 현재도 재현 (Model 필드 없음)' 으로 설계.
  향후 빌드에서 Model 노출이 추가되면 이 TC가 FAIL → 스펙 수정 반영 판단 필요.

metadata:
  source: "gallery_odin2 · GAL-BUG-001 regression anchor (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset 환경 (EXIF Make=ALTech, Model=AT-M150 주입된 사진)"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: verify_shell
    command: "test -f /sdcard/DCIM/MyGallery_TC/IMG_20260421_022.jpg && echo OK || echo MISSING"
    expected: "OK"
    description: "대상 파일(Make/Model EXIF 주입) 존재 확인"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 662
    description: "IMG 22 상세 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 648
    y: 128
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 241
    description: "상세 정보 선택"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_08_01_info_no_model"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q 'ALTech' /sdcard/ui.xml && echo HAS_MAKE || echo NO_MAKE"
    expected: "NO_MAKE"
    description: "Make(제조사) 필드 미노출 — preset EXIF는 'ALTech' 주입됨"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q 'AT-M150' /sdcard/ui.xml && echo HAS_MODEL || echo NO_MODEL"
    expected: "NO_MODEL"
    description: "Model(기기명) 필드 미노출 — preset EXIF는 'AT-M150' 주입됨"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && (grep -q '기기:' /sdcard/ui.xml || grep -q '모델:' /sdcard/ui.xml || grep -q 'Model:' /sdcard/ui.xml) && echo HAS_LABEL || echo NO_LABEL"
    expected: "NO_LABEL"
    description: "'기기:', '모델:', 'Model:' 등 어느 라벨도 노출되지 않음"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 648
    y: 1099
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
