tc_name: "GAL_FUNC_11_photo_edit_filter"
description: |
  [마이 갤러리 · 편집 필터 6종 적용]
  편집 진입 → 필터 스트립에서 6종 필터 순차 적용 (원본/흑백/세피아/자동 보정/빈티지/폴라로이드).
  초기 4개는 즉시 보이며, 빈티지/폴라로이드는 스트립 좌측 스와이프 필요.
  저장하지 않고 BACK으로 취소.

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset 환경"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "stat -c %s /sdcard/DCIM/MyGallery_TC/IMG_20260421_024.jpg > /sdcard/pre_filter_size.txt"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 600
    y: 418
    description: "IMG 24 상세 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 456
    y: 128
    description: "btnEdit 진입"
    post_wait: 2000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "원본"
    description: "필터 스트립 '원본' 라벨"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "흑백"
    description: "필터 스트립 '흑백' 라벨"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "세피아"
    description: "필터 스트립 '세피아' 라벨"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "자동 보정"
    description: "필터 스트립 '자동 보정' 라벨"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 272
    y: 1312
    description: "필터 '흑백' 적용"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_11_01_bw"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 432
    y: 1312
    description: "필터 '세피아' 적용"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_11_02_sepia"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 592
    y: 1312
    description: "필터 '자동 보정' 적용"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_11_03_auto"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: swipe
    x: 600
    y: 1332
    x2: 100
    y2: 1332
    duration: 300
    description: "필터 스트립 좌측 스와이프 → 빈티지/폴라로이드 노출"
    post_wait: 600
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "빈티지"
    description: "스와이프 후 '빈티지' 필터 노출"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "폴라로이드"
    description: "스와이프 후 '폴라로이드' 필터 노출"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 447
    y: 1312
    description: "필터 '빈티지' 적용"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_11_04_vintage"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 607
    y: 1312
    description: "필터 '폴라로이드' 적용"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_11_05_polaroid"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 우측 스와이프로 원본 복귀 탭
  - action: swipe
    x: 100
    y: 1332
    x2: 600
    y2: 1332
    duration: 300
    post_wait: 600
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 112
    y: 1312
    description: "필터 '원본' 복귀 적용"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_11_06_original"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "편집 취소 (BACK)"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnFavorite /sdcard/ui.xml && echo DETAIL || echo ELSE"
    expected: "DETAIL"
    description: "상세 복귀 확인"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "PRE=$(cat /sdcard/pre_filter_size.txt); POST=$(stat -c %s /sdcard/DCIM/MyGallery_TC/IMG_20260421_024.jpg); [ \"$PRE\" = \"$POST\" ] && echo UNCHANGED || echo CHANGED"
    expected: "UNCHANGED"
    description: "원본 파일 변경 없음"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: shell
    command: "rm -f /sdcard/pre_filter_size.txt"
    execution_mode: SHELL_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
