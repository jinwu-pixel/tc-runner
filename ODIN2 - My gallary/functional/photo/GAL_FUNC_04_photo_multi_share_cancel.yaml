tc_name: "GAL_FUNC_04_photo_multi_share_cancel"
description: |
  [마이 갤러리 · 다중 선택 공유 인텐트 노출 확인 (취소)]
  다중 선택 모드에서 '선택 항목 공유' 버튼 → 시스템 공유 시트 노출 확인.
  실제 공유는 수행하지 않고 BACK으로 취소.
  관찰: 공유 시트에서 BACK 시 다중 선택 모드까지 해제되어 기본 리스트로 복귀.

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset 환경 적용됨"
  - "저장공간 권한 '모두 허용'"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "리스트 진입 확인"
    timeout: 5000
    execution_mode: UI_AUTO
    step_role: SETUP
    compile_status: OK

  - action: swipe
    x: 600
    y: 418
    x2: 600
    y2: 418
    duration: 1000
    description: "IMG 24 롱프레스 — 다중 선택 진입"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnShareContainer /sdcard/ui.xml && echo OK || echo FAIL"
    expected: "OK"
    description: "공유 버튼 노출 (다중 선택 모드 진입 확인)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 359
    y: 1245
    description: "선택 항목 공유 버튼 탭"
    post_wait: 2000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_04_01_share_sheet"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q 'com.android.intentresolver' /sdcard/ui.xml && echo RESOLVER || echo OTHER"
    expected: "RESOLVER"
    description: "시스템 공유 시트 호스트 (com.android.intentresolver) 로 전환"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && (grep -q 'Quick Share' /sdcard/ui.xml || grep -q '이미지 공유' /sdcard/ui.xml) && echo SHEET_OK || echo SHEET_MISSING"
    expected: "SHEET_OK"
    description: "공유 시트 앵커 텍스트 노출 (Quick Share 또는 이미지 공유 제목)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "공유 시트 취소 — BACK"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_04_02_after_cancel"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q 'com.example.mygalleryapp' /sdcard/ui.xml && echo BACK_TO_APP || echo ELSEWHERE"
    expected: "BACK_TO_APP"
    description: "갤러리 앱 포그라운드 복귀"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "기본 리스트 상태로 복귀 (BACK이 다중 선택 모드까지 해제)"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
