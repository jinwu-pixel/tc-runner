tc_name: "GAL_FUNC_13_photo_wallpaper_cancel"
description: |
  [마이 갤러리 · 배경화면 설정 플로우 (취소)]
  사진 상세 → ⋮ → '배경화면으로 설정' → 앱 내 커스텀 선택 다이얼로그 노출
  (홈 화면 / 잠금 화면 / 홈 및 잠금 화면 / 취소) → 취소 버튼 탭 → 상세 복귀.
  주의: 실제 배경화면 적용은 수행하지 않음 (테스트 후 환경 변화 방지).

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset 환경"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 600
    y: 418
    description: "IMG 24 상세 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 648
    y: 128
    description: "btnMore (⋮)"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "배경화면으로 설정"
    description: "⋮ 메뉴에 '배경화면으로 설정' 항목 노출"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 433
    description: "메뉴 '배경화면으로 설정' 선택"
    post_wait: 2000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_13_01_wp_chooser"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "배경화면 설정"
    description: "선택 다이얼로그 타이틀"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "홈 화면"
    description: "옵션 1 '홈 화면'"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "잠금 화면"
    description: "옵션 2 '잠금 화면'"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "홈 및 잠금 화면"
    description: "옵션 3 '홈 및 잠금 화면'"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "취소"
    description: "취소 버튼 존재"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 574
    y: 964
    description: "취소 버튼 탭 (실제 배경화면 적용하지 않음)"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_13_02_after_cancel"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnFavorite /sdcard/ui.xml && echo DETAIL || echo ELSE"
    expected: "DETAIL"
    description: "사진 상세 보기 복귀"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q '배경화면 설정' /sdcard/ui.xml && echo STILL || echo CLOSED"
    expected: "CLOSED"
    description: "다이얼로그 사라짐"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
