tc_name: "GAL_FUNC_06_photo_detail_info_basic"
description: |
  [마이 갤러리 · 사진 상세 정보 패널 (GPS 없는 사진)]
  IMG 24 (GPS EXIF 없음) 상세 진입 → ⋮ → 상세 정보 →
  하단 시트 노출 5필드 검증 (날짜/파일명/경로/크기/해상도).
  GPS EXIF 없는 사진은 '위치' 필드가 표시되지 않음을 음성 검증.

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset 환경 적용됨 (IMG_20260421_024.jpg GPS 없음)"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    timeout: 5000
    execution_mode: UI_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 600
    y: 418
    description: "IMG 24 셀 탭 — 상세 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 648
    y: 128
    description: "btnMore (⋮) 탭"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 241
    description: "메뉴 '상세 정보' 선택"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_06_01_info_panel"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "상세 정보"
    description: "상세 정보 패널 제목"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "날짜: 2026-04-21"
    description: "날짜 필드 (preset EXIF 기준 '날짜:' prefix)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "파일명: IMG_20260421_024.jpg"
    description: "파일명 필드"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "경로: /storage/emulated/0/DCIM/MyGallery_TC/"
    description: "경로 필드 (저장 디렉토리 prefix)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "크기:"
    description: "크기 필드 (실제 값은 빌드/압축에 따라 가변)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "해상도: 1280x720"
    description: "해상도 필드 (IMG 24 = HD preset)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q '위치:' /sdcard/ui.xml && echo HAS_LOC || echo NO_LOC"
    expected: "NO_LOC"
    description: "IMG 24는 GPS EXIF 없음 → '위치:' 필드 미노출"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnCloseInfo /sdcard/ui.xml && echo OK || echo FAIL"
    expected: "OK"
    description: "닫기 버튼 (btnCloseInfo) 존재"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 648
    y: 1099
    description: "닫기 버튼 탭 — 정보 패널 닫기"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnCloseInfo /sdcard/ui.xml && echo STILL || echo CLOSED"
    expected: "CLOSED"
    description: "정보 패널 닫힘"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "상세 → 리스트 복귀"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
