tc_name: "GAL_FUNC_22_portrait_lock_enforcement"
description: |
  [마이 갤러리 · 세로 고정 준수 검증]
  auto-rotate 허용 상태에서 갤러리의 주요 Activity (PhotoList/AlbumList/TrashList/Detail)가
  세로 고정을 유지하는지 dumpsys 기반 검증.
  ODIN2 단말 특성상 런처도 세로 고정 → 앱 동작과 단말 제약을 구분하여 기록.

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 1"
    description: "자동 회전 허용 (테스트용)"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    description: "세로 상태로 리셋 후 개별 회전 시도"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # 사진 탭 상태 회전 시도
  - action: shell
    command: "settings put system user_rotation 1"
    description: "landscape(90°) 강제 요청"
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "dumpsys window displays 2>/dev/null | grep -m1 mCurrentRotation | grep -q ROTATION_0 && echo PORTRAIT || echo ROTATED"
    expected: "PORTRAIT"
    description: "사진 탭: user_rotation=1 요청에도 display ROTATION_0 유지 (세로 고정)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_22_01_list_stays_portrait"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 사진 상세 회전 시도
  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 600
    y: 418
    description: "IMG 24 상세 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 1"
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "dumpsys window displays 2>/dev/null | grep -m1 mCurrentRotation | grep -q ROTATION_0 && echo PORTRAIT || echo ROTATED"
    expected: "PORTRAIT"
    description: "사진 상세: 세로 고정 유지"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_22_02_detail_stays_portrait"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # TEARDOWN: 모두 원복
  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
