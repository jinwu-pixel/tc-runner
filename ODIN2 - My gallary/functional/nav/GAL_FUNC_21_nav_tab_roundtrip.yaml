tc_name: "GAL_FUNC_21_nav_tab_roundtrip"
description: |
  [마이 갤러리 · 3탭 왕복 (BUG-003 SUSPECT 감시)]
  사진 → 앨범 → 휴지통 → 사진 으로 순회 왕복 후 사진 탭 본문이 정상 렌더 유지되는지 검증.
  GAL-BUG-003 [SUSPECT] 재현 감시 anchor: "탭 전환 왕복 후 사진 탭 빈 렌더" 현상이 재현되면 FAIL.

metadata:
  source: "gallery_odin2 BUG-003 regression anchor (2026-04-21)"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "초기 사진 탭 렌더"
    timeout: 5000
    execution_mode: UI_AUTO
    step_role: SETUP
    compile_status: OK

  # 왕복 1 ─────
  - action: tap_xy
    x: 360
    y: 1408
    description: "앨범 탭 전환"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "앨범"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 600
    y: 1408
    description: "휴지통 탭 전환"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "휴지통"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 120
    y: 1408
    description: "사진 탭 복귀"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_21_01_after_round1"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "사진 탭 본문 렌더 유지 (round1 이후)"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # 왕복 2 ─────
  - action: tap_xy
    x: 360
    y: 1408
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 600
    y: 1408
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1408
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 120
    y: 1408
    description: "사진 탭 복귀 (round2)"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_21_02_after_round2"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "BUG-003 회귀 검증: 2회 왕복 후에도 날짜 헤더 노출"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q root_layout /sdcard/ui.xml && echo OK || echo EMPTY"
    expected: "OK"
    description: "미디어 아이템 (root_layout) 최소 1개 이상 렌더 (빈 본문 아님)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
