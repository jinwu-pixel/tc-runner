tc_name: "GAL_FUNC_14_video_play_pause"
description: |
  [마이 갤러리 · 동영상 재생/정지]
  리스트에서 VID_20s.mp4 탭 → 동영상 플레이어 자동 재생 →
  본문 단일 탭으로 컨트롤 토글 → 중앙 ⏯ 버튼으로 재생/정지 전환.

  플레이어 컨트롤은 Jetpack Compose/커스텀 View 로 보이며 uiautomator dump에 노출되지 않아
  idle state 획득 불가 → 재생/정지 상태 검증은 manual_pause 로 수동 수행.

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: SEMI_AUTO
  execution_type: MANUAL_LOCAL
  manual_detail: "BUTTON_TOUCH"
  has_manual_steps: true
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset (VID_20s.mp4 = 20초 LGU+ 영상)"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    timeout: 5000
    execution_mode: UI_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 418
    description: "VID_20s.mp4 셀 탭 — 비디오 플레이어 진입 + 자동 재생"
    post_wait: 3000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_14_01_video_playing"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: manual_pause
    description: |
      [수동 검증 · 재생 상태]
      화면에서 확인:
      1) LGU+ 영상 프레임이 재생 중인지 (정지 화면 아닌지)
      2) 화면을 한 번 탭하여 컨트롤 바가 나타나는지
      3) 하단 시간이 진행 중 (예: 00:00:03 → 00:00:04) 인지
      4) 중앙 버튼이 '⏸ (pause 모양)' 인지
      문제 없으면 [Continue], 아니면 [Fail]
    manual_timeout: 60
    on_timeout: fail
    execution_mode: MANUAL_REQUIRED
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    description: "본문 중앙 단일 탭 — 컨트롤 바 노출"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1420
    description: "중앙 ⏯ 버튼 탭 — 일시정지 전환"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_14_02_video_paused"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: manual_pause
    description: |
      [수동 검증 · 일시정지 상태]
      화면에서 확인:
      1) 영상이 정지 화면 상태로 멈췄는지
      2) 중앙 버튼이 '▶ (play 모양)' 으로 바뀌었는지
      3) 하단 시간이 고정 (변동 없음) 인지
      문제 없으면 [Continue], 아니면 [Fail]
    manual_timeout: 60
    on_timeout: fail
    execution_mode: MANUAL_REQUIRED
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    description: "컨트롤 바 재노출 (자동 사라진 경우 대비)"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1420
    description: "중앙 ⏯ 버튼 재탭 — 재생 재개"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_14_03_video_resumed"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: manual_pause
    description: |
      [수동 검증 · 재생 재개]
      화면에서 확인:
      1) 영상 프레임이 다시 진행 중인지
      2) 중앙 버튼이 '⏸ (pause 모양)' 으로 복귀했는지
      문제 없으면 [Continue], 아니면 [Fail]
    manual_timeout: 60
    on_timeout: fail
    execution_mode: MANUAL_REQUIRED
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "BACK — 비디오 플레이어 종료"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "리스트 복귀"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
