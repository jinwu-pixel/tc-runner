tc_name: "GAL_FUNC_15_video_seek_controls"
description: |
  [마이 갤러리 · 동영상 5초 되감기/빨리감기]
  VID_3min.mp4 (03:41) 재생 중 ⏪/⏩ 버튼으로 5초 이동 동작 검증.
  본문 중앙 탭으로 컨트롤 노출 후 좌우 버튼 탭.

  재생 위치는 uiautomator 에서 관측 불가 → manual_pause 로 수동 확인.

metadata:
  source: "gallery_odin2 functional skeleton · 실기 walkthrough (2026-04-21)"
  runnable: true
  tc_class: SEMI_AUTO
  execution_type: MANUAL_LOCAL
  manual_detail: "BUTTON_TOUCH"
  has_manual_steps: true
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset (VID_3min.mp4 = 03:41 LGU+ 영상)"

steps:
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: tap_xy
    x: 120
    y: 418
    description: "VID_3min.mp4 탭 (4/21 섹션 1번째)"
    post_wait: 3000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  # 재생 중 ⏸ 일시정지로 위치 고정 (컨트롤 테스트 용이성)
  - action: tap_xy
    x: 360
    y: 780
    description: "컨트롤 노출"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 1420
    description: "일시정지 (현재 위치 고정)"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_15_01_paused_pos"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: manual_pause
    description: |
      [수동 검증 · 초기 위치 기록]
      하단 시간표시(좌측) 값을 기록해주세요. 예: "00:00:05"
      일시정지 상태가 맞다면 [Continue]
    manual_timeout: 60
    on_timeout: fail
    execution_mode: MANUAL_REQUIRED
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    description: "컨트롤 재노출"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 260
    y: 1420
    description: "⏪ 5초 되감기 탭 (1회차)"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_15_02_rewind_5s"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: manual_pause
    description: |
      [수동 검증 · 되감기 검증]
      되감기 버튼 탭 직전 대비 현재 시간이 약 5초 줄었는지 확인.
      예: 00:00:10 → 00:00:05. 시작점이 5초 미만이면 00:00:00 에 정지.
      맞으면 [Continue], 아니면 [Fail]
    manual_timeout: 60
    on_timeout: fail
    execution_mode: MANUAL_REQUIRED
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    description: "컨트롤 재노출"
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 460
    y: 1420
    description: "⏩ 5초 빨리감기 탭 (1회차)"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_15_03_forward_5s"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 460
    y: 1420
    description: "⏩ 2회차 — 누적 +10초"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    post_wait: 500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 460
    y: 1420
    description: "⏩ 3회차 — 누적 +15초"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "GAL_FUNC_15_04_forward_15s_total"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: manual_pause
    description: |
      [수동 검증 · 빨리감기 누적 3회 (+15초)]
      이전 되감기 지점 대비 약 +15초 진행되었는지 확인.
      전체 03:41 범위 내에서 선형 이동.
      맞으면 [Continue], 아니면 [Fail]
    manual_timeout: 60
    on_timeout: fail
    execution_mode: MANUAL_REQUIRED
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
