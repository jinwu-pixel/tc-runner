tc_name: "GAL_SMOKE_ODIN2"
description: |
  [마이 갤러리 · ODIN2 스모크 회귀]
  매 세션 시작 시 10분 내 실행하여 핵심 플로우 회귀 확인용.
  한 파일에 크리티컬 경로만 추려 조립:
    1) 진입 + preset 무결성 (사진 탭 + 날짜 헤더 3개)
    2) 사진 상세 진입 + 상단바 토글 (GAL_FUNC_02 회귀 앵커)
    3) 다중 선택 하단 플로팅바 3버튼 (GAL_FUNC_03)
    4) 상세 정보 패널 GPS/Model (GAL-BUG-001 regression anchor)
    5) 편집 진입 + 필터 스트립 6종 라벨
    6) 앨범 탭 + MyGallery_TC 앨범 노출
    7) 휴지통 탭 접근
    8) 3탭 왕복 후 사진 탭 정상 렌더 (GAL-BUG-003 SUSPECT 감시)

  실패 시 상세 TC (GAL_FUNC_NN) 로 넘어가 원인 파고들 것.

metadata:
  source: "gallery_odin2 smoke test · 2026-04-21"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.example.mygalleryapp"
    version: "1.0.26042114"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "GAL_FUNC_01 preset 환경 (사진 25장 + 영상 2개)"
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "저장공간 권한 '모두 허용' 상태"

steps:
  # ───── SETUP ─────
  - action: shell
    command: "settings put system accelerometer_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "settings put system user_rotation 0"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: verify_shell
    command: "ls /sdcard/DCIM/MyGallery_TC/ | wc -l | tr -d ' '"
    expected: "27"
    description: "preset 파일 수 (25 photos + 2 videos) 무결성"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am force-stop com.example.mygalleryapp"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "monkey -p com.example.mygalleryapp -c android.intent.category.LAUNCHER 1"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 3000
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # ───── 1) 진입 + preset 검증 ─────
  - action: screenshot
    name: "SMOKE_01_list_launch"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "마이 갤러리"
    description: "상단 타이틀"
    timeout: 5000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "t0 날짜 헤더"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 20일"
    description: "t-1 날짜 헤더"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # ───── 2) 사진 상세 + 상단바 토글 (FUNC_02 회귀 앵커) ─────
  - action: tap_xy
    x: 600
    y: 418
    description: "IMG 24 상세 진입"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnBack /sdcard/ui.xml && echo VISIBLE || echo HIDDEN"
    expected: "VISIBLE"
    description: "상단바 btnBack 노출"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    description: "본문 중앙 단일 탭 → 상단바 숨김"
    post_wait: 600
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnBack /sdcard/ui.xml && echo VISIBLE || echo HIDDEN"
    expected: "HIDDEN"
    description: "상단바 숨김 토글 확인 (FUNC_02 회귀)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 360
    y: 780
    post_wait: 600
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  # ───── 3) 상세 정보 (GPS 있는 IMG 22 로 이동) ─────
  - action: swipe
    x: 600
    y: 780
    x2: 100
    y2: 780
    duration: 200
    description: "왼쪽 스와이프 → IMG 23"
    post_wait: 700
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: swipe
    x: 600
    y: 780
    x2: 100
    y2: 780
    duration: 200
    description: "왼쪽 스와이프 → IMG 22 (GPS 있음)"
    post_wait: 700
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 648
    y: 128
    description: "btnMore"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 524
    y: 241
    description: "상세 정보"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "SMOKE_02_info_gps"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "위치:"
    description: "GPS EXIF 읽힘 (IMG 22)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q 'AT-M150' /sdcard/ui.xml && echo HAS_MODEL || echo NO_MODEL"
    expected: "NO_MODEL"
    description: "GAL-BUG-001 regression anchor: Model EXIF 여전히 미노출"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: tap_xy
    x: 648
    y: 1099
    description: "정보 패널 닫기"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  # ───── 4) 편집 + 필터 스트립 6종 라벨 ─────
  - action: tap_xy
    x: 456
    y: 128
    description: "btnEdit"
    post_wait: 2000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnRotate /sdcard/ui.xml && echo OK || echo FAIL"
    expected: "OK"
    description: "편집 화면 진입"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "원본"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "흑백"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "세피아"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "자동 보정"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "편집 취소 (변경 없음)"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "상세 → 리스트 복귀"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  # ───── 5) 다중선택 하단 플로팅바 ─────
  - action: swipe
    x: 600
    y: 418
    x2: 600
    y2: 418
    duration: 1000
    description: "IMG 24 롱프레스 → 다중 선택"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q btnSelectAllContainer /sdcard/ui.xml && grep -q btnShareContainer /sdcard/ui.xml && grep -q btnDeleteContainer /sdcard/ui.xml && echo OK || echo FAIL"
    expected: "OK"
    description: "다중 선택 하단 플로팅바 3버튼 (전체 선택/공유/삭제)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: key
    key: "KEYCODE_BACK"
    description: "다중 선택 해제"
    post_wait: 800
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  # ───── 6) 앨범 탭 ─────
  - action: tap_xy
    x: 360
    y: 1408
    description: "앨범 탭"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "MyGallery_TC"
    description: "preset 앨범 노출"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "최신순"
    description: "정렬 기본값"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # ───── 7) 휴지통 탭 ─────
  - action: tap_xy
    x: 600
    y: 1408
    description: "휴지통 탭"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: verify_text
    target: "휴지통"
    description: "휴지통 타이틀"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # ───── 8) 3탭 왕복 후 사진 탭 정상 렌더 (GAL-BUG-003 감시) ─────
  - action: tap_xy
    x: 360
    y: 1408
    description: "앨범 탭 (왕복 중간)"
    post_wait: 1000
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: tap_xy
    x: 120
    y: 1408
    description: "사진 탭 복귀 (왕복 완료)"
    post_wait: 1500
    execution_mode: UI_AUTO
    step_role: ACTION
    compile_status: OK

  - action: screenshot
    name: "SMOKE_03_after_roundtrip"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "2026년 04월 21일"
    description: "BUG-003 감시: 왕복 후에도 사진 탭 본문 정상"
    timeout: 3000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_shell
    command: "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && grep -q root_layout /sdcard/ui.xml && echo OK || echo BLANK"
    expected: "OK"
    description: "빈 렌더 아님 (grid item 노출)"
    execution_mode: SHELL_AUTO
    step_role: ASSERT
    compile_status: OK

  # ───── TEARDOWN ─────
  - action: key
    key: "KEYCODE_HOME"
    execution_mode: UI_AUTO
    step_role: TEARDOWN
    compile_status: OK
