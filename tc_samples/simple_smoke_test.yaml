name: 기본 동작 스모크 테스트
description: HOME 키, 스크린샷, shell 명령 등 기본 동작이 정상 작동하는지 확인
steps:
  - action: key
    keycode: HOME

  - action: wait
    seconds: 1

  - action: screenshot
    name: home_screen

  - action: verify_shell
    command: "dumpsys window | grep mCurrentFocus"
    expected: "Window"

  - action: shell
    command: "getprop ro.product.model"

  - action: key
    keycode: HOME
