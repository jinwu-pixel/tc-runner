tc_name: "SETTINGS_SMOKE_01_app_launch_J"
description: |
  [Settings · THOR2_J SMOKE 01 — 앱 콜드 런치 + ROOT 라벨 정합성 (ja-JP)]
  Phase 1A 첫 SMOKE. force-stop 후 cold launch → Settings ROOT 화면 핵심
  top-level 라벨이 일관되게 노출되는지 verify 한다 (ja-JP locale).

  ODIN2 ko-KR `SETTINGS_SMOKE_01_app_launch.yaml` (commit 5e4dc44) 동일 패턴.
  anchor만 일본어로 교체. 단말 횡 비교 시드.

  본 TC가 검증하지 않는 것 (의도적 제외):
    - 하위 화면 진입 (ネットワーク / 接続設定 / アプリ / 通知 / バッテリー)
    - 검색 입력
    - toggle / permission 변경
    - 첫 화면 미노출 main label (通知 / バッテリー / ストレージ — scroll 필요, Phase 1+)
    - dynamic sub-label
  위 항목은 Phase 1+ 후속 분리 대상.

metadata:
  source: "thor2_j_settings_phase1a smoke 01 · 2026-05-08"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.android.settings"
    version: "14"
  target_device: "THOR2_J (AT-M140 thor2 alt_thor2) 480x800 @ 220dpi, portrait, ja-JP"

preconditions:
  - "THOR2_J ADB serial <thor2_device_serial> 연결"
  - "com.android.settings 설치 (Android 14 stock)"
  - "persist.sys.locale=ja"
  - "keyguard 해제 상태"

steps:
  # ──── SETUP: 콜드 런치 ────
  - action: shell
    command: "am force-stop com.android.settings"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am start -n com.android.settings/.Settings"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # ──── ASSERT: ROOT 라벨 정합성 (ja-JP) ────
  - action: screenshot
    name: "SETTINGS_SMOKE_01_J_home"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "設定"
    description: "ROOT 헤더 라벨 (length=2 WEAK_VERIFY_TEXT step-level suppress, top-level 메뉴 4건 보강)"
    timeout: 5000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK
    lint_allow:
      - WEAK_VERIFY_TEXT

  - action: verify_text
    target: "設定を検索"
    description: "검색바 placeholder"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "ネットワークとインターネット"
    description: "top-level 메뉴 1 — 네트워크 및 인터넷 (ko-KR 동일 anchor의 ja-JP 변종)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "接続設定"
    description: "top-level 메뉴 2 — 연결된 기기 (ko-KR `연결된 기기`의 ja-JP 변종)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "アプリ"
    description: "top-level 메뉴 3 — 앱 (length=3, lint OK)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "海外ローミング"
    description: "top-level 메뉴 4 — 통신사 로밍 (ko-KR `T 로밍`의 ja-JP 변종, KT SIM 기준)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # ──── TEARDOWN ────
  - action: shell
    command: "am force-stop com.android.settings"
    execution_mode: SHELL_AUTO
    step_role: TEARDOWN
    compile_status: OK
