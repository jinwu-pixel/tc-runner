tc_name: SS_TC05_boundary_values
description: |
  TC-05A/B/C: 장시간 통화 경계값 검증 (9/10/11초)

  테스트 모드(임계값 10초)에서 9초/10초/11초 통화 시
  LONG_CALL_DURATION 발생 여부 확인.
  TC-05A: 9초 → 미발생, TC-05B: 10초 → 발생, TC-05C: 11초 → 발생.

  우선순위: 필수 | 반복: 각 3회
metadata:
  source: TC_1.xlsx / SS-TC 1
  runnable: true
  tc_class: SEMI_AUTO
  execution_type: EXTERNAL_EVENT
  manual_detail: CALL_RECEIVE
steps:
- action: shell
  command: setprop log.tag.SeniorShield-CallMonitor DEBUG && setprop log.tag.SeniorShield-Coordinator
    DEBUG && setprop log.tag.SeniorShield-Overlay DEBUG && setprop log.tag.SeniorShield-Cooldown
    DEBUG && setprop log.tag.SeniorShield-Session DEBUG && setprop log.tag.SeniorShield-AppUsage
    DEBUG
  description: Debug 로그 레벨 활성화 (MTK 기기 대응)
- action: shell
  command: pm grant com.example.seniorshield android.permission.READ_PHONE_STATE
  description: READ_PHONE_STATE 권한 허용 (pm grant) (pm grant)
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 앱 실행
- action: wait
  duration: 2000
- action: manual_pause
  execution_mode: MANUAL_REQUIRED
  step_role: SETUP
  description: '설정 > 디버그 > ''테스트 모드'' 토글 ON 확인 (장시간 통화 기준: 10초)'
  manual_timeout: 30
- action: shell
  command: logcat -c
  description: '[TC-05A] logcat 초기화'
- action: manual_pause
  execution_mode: EXTERNAL_EVENT
  step_role: ACTION
  description: '[TC-05A] 보조폰에서 전화 → 수신 → 정확히 9초 후 종료'
  manual_timeout: 60
- action: wait
  duration: 5000
- action: verify_shell
  command: "tmp=\"/data/local/tmp/tc_runner_rc_ce4c415f5467_$$.txt\"; rm -f \"$tmp\"; pre_cleanup_rc=$?; if [ \"$pre_cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_PRE_CLEANUP_RC=$pre_cleanup_rc\" >&2; exit \"$pre_cleanup_rc\"; fi; logcat -d -s SeniorShield-CallMonitor:D SeniorShield-Coordinator:D >\"$tmp\"; source_rc=$?; if [ \"$source_rc\" -ne 0 ]; then echo \"TC_ASSERT_SOURCE_RC=$source_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$source_rc\"; fi; count=$(grep -c 'LONG_CALL_DURATION' \"$tmp\"); grep_rc=$?; if [ \"$grep_rc\" -gt 1 ]; then echo \"TC_ASSERT_GREP_RC=$grep_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$grep_rc\"; fi; case \"$count\" in ''|*[!0-9]*) echo \"TC_ASSERT_COUNT_INVALID=$count\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\";; esac; if ! [ \"$count\" -eq 0 ]; then echo \"TC_ASSERT_COUNT=$count EXPECTED=count==0\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\"; fi; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; exit \"$cleanup_rc\"; fi; printf '%s\\n' '__TC_ASSERT_OK_ce4c415f5467__'"
  expected: "__TC_ASSERT_OK_ce4c415f5467__"
  description: '[TC-05A] LONG_CALL_DURATION 미발생 확인 (0이어야 PASS)'
- action: screenshot
  name: TC05A_9sec_result
- action: shell
  command: logcat -c
  description: '[TC-05B] logcat 초기화'
- action: manual_pause
  execution_mode: EXTERNAL_EVENT
  step_role: ACTION
  description: '[TC-05B] 보조폰에서 전화 → 수신 → 정확히 10초 후 종료'
  manual_timeout: 60
- action: wait
  duration: 5000
- action: verify_shell
  command: logcat -d -s SeniorShield-CallMonitor:D SeniorShield-Coordinator:D
  expected: LONG_CALL_DURATION
  description: '[TC-05B] LONG_CALL_DURATION 발생 확인'
- action: screenshot
  name: TC05B_10sec_result
- action: shell
  command: logcat -c
  description: '[TC-05C] logcat 초기화'
- action: manual_pause
  execution_mode: EXTERNAL_EVENT
  step_role: ACTION
  description: '[TC-05C] 보조폰에서 전화 → 수신 → 11초 후 종료'
  manual_timeout: 60
- action: wait
  duration: 5000
- action: verify_shell
  command: logcat -d -s SeniorShield-CallMonitor:D SeniorShield-Coordinator:D
  expected: LONG_CALL_DURATION
  description: '[TC-05C] LONG_CALL_DURATION 발생 확인'
- action: screenshot
  name: TC05C_11sec_result
