tc_name: SS_TC11_multi_subscription
description: |
  TC-11: 다중 구독 안전성 확인

  홈/기록/설정 반복 진입 + 백그라운드/포그라운드 전환 후 통화 시
  upstream callback이 1개만 유지되고 이벤트 중복이 없는지 확인.

  우선순위: 중요 | 반복: 3회
metadata:
  source: TC_1.xlsx / SS-TC 1
  runnable: true
  tc_class: SEMI_AUTO
  execution_type: EXTERNAL_EVENT
  manual_detail: CALL_RECEIVE
steps:
- action: shell
  command: setprop log.tag.SeniorShield-CallMonitor DEBUG && setprop log.tag.SeniorShield-Coordinator
    DEBUG && setprop log.tag.SeniorShield-Overlay DEBUG && setprop log.tag.SeniorShield-Cooldown
    DEBUG && setprop log.tag.SeniorShield-Session DEBUG && setprop log.tag.SeniorShield-AppUsage
    DEBUG
  description: Debug 로그 레벨 활성화 (MTK 기기 대응)
- action: shell
  command: pm grant com.example.seniorshield android.permission.READ_PHONE_STATE
  description: READ_PHONE_STATE 권한 허용 (pm grant) (pm grant)
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 앱 실행
- action: wait
  duration: 2000
- action: manual_pause
  execution_mode: MANUAL_REQUIRED
  step_role: SETUP
  description: 설정 > 디버그 > 테스트 모드 ON + 전체 상태 초기화
  manual_timeout: 30
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 홈 진입 (1회)
- action: wait
  duration: 1000
- action: shell
  command: input keyevent KEYCODE_HOME
  description: 백그라운드 전환
- action: wait
  duration: 2000
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 포그라운드 복귀 (2회)
- action: wait
  duration: 1000
- action: shell
  command: input keyevent KEYCODE_HOME
  description: 백그라운드 전환
- action: wait
  duration: 2000
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 포그라운드 복귀 (3회)
- action: wait
  duration: 2000
- action: shell
  command: logcat -c
  description: logcat 초기화 (통화 감지 확인용)
- action: manual_pause
  execution_mode: EXTERNAL_EVENT
  step_role: ACTION
  description: 보조폰에서 전화 → 수신 → 12초 이상 유지 → 종료
  manual_timeout: 120
- action: wait
  duration: 5000
- action: verify_shell
  command: logcat -d -s SeniorShield-CallMonitor:D SeniorShield-Coordinator:D
  expected: LONG_CALL_DURATION
  description: LONG_CALL_DURATION 발생 확인
- action: shell
  command: logcat -d -s SeniorShield-CallMonitor:D | grep -c 'LONG_CALL_DURATION'
  description: LONG_CALL_DURATION 발생 횟수 확인 (1이어야 정상 — 중복 없음)
- action: shell
  command: logcat -d -s SeniorShield-Coordinator:D | grep -c 'notification escalation'
  description: notification escalation 횟수 확인 (1 이하여야 정상)
- action: screenshot
  name: TC11_multi_subscription
