tc_name: SS_TC02_permission_allow_idle
description: |
  TC-02: 권한 허용 후 Idle 진입 확인

  권한 허용 직후 NoPermission→Idle 전이,
  TelephonyCallback registered, 중복 등록 없음 확인.

  우선순위: 필수 | 반복: 3회
metadata:
  source: TC_1.xlsx / SS-TC 1
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: NONE
steps:
- action: shell
  command: setprop log.tag.SeniorShield-CallMonitor DEBUG && setprop log.tag.SeniorShield-Coordinator
    DEBUG && setprop log.tag.SeniorShield-Overlay DEBUG && setprop log.tag.SeniorShield-Cooldown
    DEBUG && setprop log.tag.SeniorShield-Session DEBUG && setprop log.tag.SeniorShield-AppUsage
    DEBUG
  description: Debug 로그 레벨 활성화 (MTK 기기 대응)
- action: shell
  command: pm revoke com.example.seniorshield android.permission.READ_PHONE_STATE
  description: READ_PHONE_STATE 일시 거부
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 앱 실행 (NoPermission 상태)
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 앱 재시작 (pm revoke 후 프로세스 재생성)
- action: wait
  duration: 3000
- action: shell
  command: logcat -c
  description: logcat 초기화
- action: shell
  command: pm grant com.example.seniorshield android.permission.READ_PHONE_STATE
  description: READ_PHONE_STATE 권한 허용 (pm grant)
- action: wait
  duration: 3000
- action: verify_shell
  command: logcat -d -s SeniorShield-CallMonitor:D
  expected: registered
  description: TelephonyCallback registered 로그 확인
- action: verify_shell
  command: logcat -d -s SeniorShield-CallMonitor:D
  expected: IDLE
  description: Idle 상태 emit 확인
- action: verify_shell
  command: "tmp=\"/data/local/tmp/tc_runner_rc_668056c3c37f_$$.txt\"; rm -f \"$tmp\"; pre_cleanup_rc=$?; if [ \"$pre_cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_PRE_CLEANUP_RC=$pre_cleanup_rc\" >&2; exit \"$pre_cleanup_rc\"; fi; logcat -d -s SeniorShield-CallMonitor:D >\"$tmp\"; source_rc=$?; if [ \"$source_rc\" -ne 0 ]; then echo \"TC_ASSERT_SOURCE_RC=$source_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$source_rc\"; fi; count=$(grep -c 'registered' \"$tmp\"); grep_rc=$?; if [ \"$grep_rc\" -gt 1 ]; then echo \"TC_ASSERT_GREP_RC=$grep_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$grep_rc\"; fi; case \"$count\" in ''|*[!0-9]*) echo \"TC_ASSERT_COUNT_INVALID=$count\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\";; esac; if ! [ \"$count\" -eq 1 ]; then echo \"TC_ASSERT_COUNT=$count EXPECTED=count==1\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\"; fi; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; exit \"$cleanup_rc\"; fi; printf '%s\\n' '__TC_ASSERT_OK_668056c3c37f__'"
  expected: "__TC_ASSERT_OK_668056c3c37f__"
  description: register 횟수 확인 (1이어야 정상)
