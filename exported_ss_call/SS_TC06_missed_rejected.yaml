tc_name: SS_TC06_missed_rejected
description: |
  TC-06: 부재중/거절 통화 처리 확인

  수신 전화를 받지 않거나 거절했을 때
  RINGING→IDLE 전이, duration=0, signal/event 미발생 확인.

  우선순위: 중요 | 반복: 2회
metadata:
  source: TC_1.xlsx / SS-TC 1
  runnable: true
  tc_class: SEMI_AUTO
  execution_type: EXTERNAL_EVENT
  manual_detail: CALL_RECEIVE
steps:
- action: shell
  command: setprop log.tag.SeniorShield-CallMonitor DEBUG && setprop log.tag.SeniorShield-Coordinator
    DEBUG && setprop log.tag.SeniorShield-Overlay DEBUG && setprop log.tag.SeniorShield-Cooldown
    DEBUG && setprop log.tag.SeniorShield-Session DEBUG && setprop log.tag.SeniorShield-AppUsage
    DEBUG
  description: Debug 로그 레벨 활성화 (MTK 기기 대응)
- action: shell
  command: pm grant com.example.seniorshield android.permission.READ_PHONE_STATE
  description: READ_PHONE_STATE 권한 허용 (pm grant) (pm grant)
- action: shell
  command: am start -n com.example.seniorshield/.MainActivity
  description: 앱 실행
- action: wait
  duration: 2000
- action: manual_pause
  execution_mode: MANUAL_REQUIRED
  step_role: SETUP
  description: 설정 > 디버그 > 테스트 모드 ON + 전체 상태 초기화
  manual_timeout: 30
- action: shell
  command: logcat -c
  description: logcat 초기화
- action: manual_pause
  execution_mode: EXTERNAL_EVENT
  step_role: ACTION
  description: 보조폰에서 전화 → 받지 않고 거절 (또는 그냥 끊길 때까지 대기)
  manual_timeout: 60
- action: wait
  duration: 5000
- action: verify_shell
  command: logcat -d -s SeniorShield-CallMonitor:D
  expected: IDLE
  description: RINGING→IDLE 전이 확인
- action: verify_shell
  command: "tmp=\"/data/local/tmp/tc_runner_rc_1ef9029cb992_$$.txt\"; rm -f \"$tmp\"; pre_cleanup_rc=$?; if [ \"$pre_cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_PRE_CLEANUP_RC=$pre_cleanup_rc\" >&2; exit \"$pre_cleanup_rc\"; fi; logcat -d -s SeniorShield-CallMonitor:D SeniorShield-Coordinator:D >\"$tmp\"; source_rc=$?; if [ \"$source_rc\" -ne 0 ]; then echo \"TC_ASSERT_SOURCE_RC=$source_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$source_rc\"; fi; count=$(grep -c 'LONG_CALL_DURATION' \"$tmp\"); grep_rc=$?; if [ \"$grep_rc\" -gt 1 ]; then echo \"TC_ASSERT_GREP_RC=$grep_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$grep_rc\"; fi; case \"$count\" in ''|*[!0-9]*) echo \"TC_ASSERT_COUNT_INVALID=$count\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\";; esac; if ! [ \"$count\" -eq 0 ]; then echo \"TC_ASSERT_COUNT=$count EXPECTED=count==0\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\"; fi; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; exit \"$cleanup_rc\"; fi; printf '%s\\n' '__TC_ASSERT_OK_1ef9029cb992__'"
  expected: "__TC_ASSERT_OK_1ef9029cb992__"
  description: LONG_CALL_DURATION 미발생 확인 (0이어야 PASS)
- action: verify_shell
  command: "tmp=\"/data/local/tmp/tc_runner_rc_7ca524e83ee0_$$.txt\"; rm -f \"$tmp\"; pre_cleanup_rc=$?; if [ \"$pre_cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_PRE_CLEANUP_RC=$pre_cleanup_rc\" >&2; exit \"$pre_cleanup_rc\"; fi; logcat -d -s SeniorShield-Coordinator:D >\"$tmp\"; source_rc=$?; if [ \"$source_rc\" -ne 0 ]; then echo \"TC_ASSERT_SOURCE_RC=$source_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$source_rc\"; fi; count=$(grep -c 'event' \"$tmp\"); grep_rc=$?; if [ \"$grep_rc\" -gt 1 ]; then echo \"TC_ASSERT_GREP_RC=$grep_rc\" >&2; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$grep_rc\"; fi; case \"$count\" in ''|*[!0-9]*) echo \"TC_ASSERT_COUNT_INVALID=$count\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\";; esac; if ! [ \"$count\" -eq 0 ]; then echo \"TC_ASSERT_COUNT=$count EXPECTED=count==0\" >&2; primary_rc=1; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; fi; exit \"$primary_rc\"; fi; rm -f \"$tmp\"; cleanup_rc=$?; if [ \"$cleanup_rc\" -ne 0 ]; then echo \"TC_ASSERT_CLEANUP_RC=$cleanup_rc\" >&2; exit \"$cleanup_rc\"; fi; printf '%s\\n' '__TC_ASSERT_OK_7ca524e83ee0__'"
  expected: "__TC_ASSERT_OK_7ca524e83ee0__"
  description: risk event 미발생 확인 (0이어야 PASS)
- action: screenshot
  name: TC06_missed_rejected
