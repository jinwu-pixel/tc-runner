tc_name: "SETTINGS_SMOKE_01_app_launch"
description: |
  [Settings · ODIN2 SMOKE 01 — 앱 콜드 런치 + ROOT 라벨 정합성]
  Phase 1A 첫 SMOKE. force-stop 후 cold launch → Settings ROOT 화면 핵심
  top-level 라벨이 일관되게 노출되는지 verify 한다.

  본 TC가 검증하지 않는 것 (의도적 제외):
    - 하위 화면 진입 (네트워크 / 연결된 기기 / 앱 / 알림 / 배터리 / 저장용량)
    - 검색 입력
    - toggle / permission 변경
    - dynamic sub-label (배터리 % / 저장용량 % — 변동성)
    - 통신사/단말 customization 라벨 (T 로밍, 안심 기능, SOS 버튼)
  위 항목은 Phase 1+ 후속 분리 대상.

metadata:
  source: "settings_phase1a smoke 01 · 2026-05-08"
  runnable: true
  tc_class: FULL_AUTO
  execution_type: AUTO
  manual_detail: "NONE"
  has_manual_steps: false
  has_shell_actions: true
  has_unresolved_params: false
  target_app:
    package: "com.android.settings"
    version: "1.0.0.1101"
  target_device: "ODIN2 (AT-M150) 720x1560 @ 320dpi, portrait"

preconditions:
  - "ODIN2 ADB serial <odin2_device_serial> 연결"
  - "com.android.settings 설치, version_name=1.0.0.1101"
  - "keyguard 해제 상태"

steps:
  # ──── SETUP: 콜드 런치 ────
  - action: shell
    command: "am force-stop com.android.settings"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: shell
    command: "am start -n com.android.settings/.Settings"
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  - action: wait
    duration: 1500
    execution_mode: SHELL_AUTO
    step_role: SETUP
    compile_status: OK

  # ──── ASSERT: ROOT 라벨 정합성 ────
  - action: screenshot
    name: "SETTINGS_SMOKE_01_home"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "설정"
    description: "ROOT 헤더 라벨 (length=2 WEAK_VERIFY_TEXT step-level suppress, top-level 메뉴 5건 보강)"
    timeout: 5000
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK
    lint_allow:
      - WEAK_VERIFY_TEXT

  - action: verify_text
    target: "네트워크 및 인터넷"
    description: "top-level 메뉴 1 — 네트워크 및 인터넷"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "연결된 기기"
    description: "top-level 메뉴 2 — 연결된 기기"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  - action: verify_text
    target: "앱"
    description: "top-level 메뉴 3 — 앱 (length=1 SHORT_VERIFY_TEXT step-level suppress)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK
    lint_allow:
      - WEAK_VERIFY_TEXT

  - action: verify_text
    target: "알림"
    description: "top-level 메뉴 4 — 알림 (length=2 WEAK_VERIFY_TEXT step-level suppress)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK
    lint_allow:
      - WEAK_VERIFY_TEXT

  - action: verify_text
    target: "배터리"
    description: "top-level 메뉴 5 — 배터리 (sub-label은 dynamic %, main label만 verify)"
    execution_mode: UI_AUTO
    step_role: ASSERT
    compile_status: OK

  # ──── TEARDOWN ────
  - action: shell
    command: "am force-stop com.android.settings"
    execution_mode: SHELL_AUTO
    step_role: TEARDOWN
    compile_status: OK
